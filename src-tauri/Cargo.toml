[package]
name = "polyhedron-explorer"
version = "0.1.0"
description = "Explore the famous polyhedra in 3D"
authors = ["Alejandro Echeverria"]
license = "MIT"
repository = "https://github.com/alejandroechev/polyhedron-explorer"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "polyhedron_explorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
log = "0.4"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
